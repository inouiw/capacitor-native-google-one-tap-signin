plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android' version '1.9.25'
}

android {
    namespace 'com.proventask.capacitor.googleauth'
    compileSdk 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false // Minify leads to build errors.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    // Same versions as Capacitor 7 uses.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-android:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // 1.8.x is the last version that supports Kotlin 1.9.
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.mockito:mockito-android:5.24.0'
    androidTestImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    // For GoogleApiAvailability.
    implementation 'com.google.android.gms:play-services-base:18.11.1'
    // credentials 1.6+ and googleid 1.2+ are compiled with Kotlin 2.1 and need Kotlin 2. Capacitor 7 uses Kotlin 1.9.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // optional - needed for credentials support from play services, for devices running
    // Android 13 and below.
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
}
