import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// As in Capacitor's own plugins: the app's Kotlin version if it sets kotlin_version, else the one Capacitor 8 uses.
buildscript {
    ext.kotlin_version = project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.android.library'
}

// An app that already applies Kotlin to this project keeps its own.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

android {
    namespace = 'com.proventask.capacitor.googleauth'
    compileSdk = 36

    defaultConfig {
        minSdk = 24
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false // Minify leads to build errors.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    // Same versions as Capacitor 8 uses.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-android:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.mockito:mockito-android:5.24.0'
    androidTestImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    // For GoogleApiAvailability.
    implementation 'com.google.android.gms:play-services-base:18.11.1'
    implementation 'androidx.credentials:credentials:1.6.0'
    // googleid 1.2.1 is compiled with Kotlin 2.4, which the Kotlin 2.2 of Capacitor 8 cannot read.
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'

    // optional - needed for credentials support from play services, for devices running
    // Android 13 and below.
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
}
